name: Publish VS Code extension

# Packages the Aria extension on demand, and publishes to the Marketplace when a
# tag like `vscode-v0.1.0` is pushed. Requires a repo secret VSCE_PAT.
on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aria/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Package
        run: vsce package
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-vscode-vsix
          path: aria/vscode/*.vsix
      - name: Publish to Marketplace (tags only)
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
